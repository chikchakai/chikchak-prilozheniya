name: android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      adres:
        description: "Test build: open this address instead of the one in capacitor.config.json"
        default: ""

jobs:
  sborka:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hinkali, chikchak]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test address
        if: inputs.adres != ''
        env:
          ADRES: ${{ inputs.adres }}
        run: node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.env.ADRES;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npx cap sync android
      - name: Upload key
        env:
          P12: ${{ secrets[format('{0}_P12', matrix.app)] }}
        run: echo "$P12" | base64 -d > "$RUNNER_TEMP/klyuch.p12"
      - name: Build
        working-directory: ${{ matrix.app }}/android
        env:
          KLYUCH_FAIL: ${{ runner.temp }}/klyuch.p12
          KLYUCH_PAROL: ${{ secrets[format('{0}_PAROL', matrix.app)] }}
          KLYUCH_ALIAS: upload
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ github.run_number }}${{ inputs.adres != '' && '-proba' || '' }}
          path: |
            ${{ matrix.app }}/android/app/build/outputs/bundle/release/*.aab
            ${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
